function home(){
const my=id=>H.filter(h=>h.id===id),best=id=>my(id).reduce((m,h)=>Math.max(m,h.p),-1);
const tot=H.length,avg=tot?Math.round(H.reduce((s,h)=>s+h.p,0)/tot):0;
A.innerHTML=`<div class="row"><h1>Привет, ${esc(U)}!</h1><button class="o" id="cu">Сменить имя</button></div><p class="s">Пять тестов по 40 вопросов: выбор ответа, вставка слова и исправление ошибки. Результаты сохраняются под вашим именем в этом браузере.</p>
<div class="g">${T.map((t,i)=>`<div class="c"><h3>${t.t}</h3><p>${t.d}</p><div class="row"><span>${best(t.id)<0?'Ещё не проходили':`Лучший результат: <b>${best(t.id)}%</b> · попыток: ${my(t.id).length}`}</span><button data-s="${i}">Начать тест</button></div></div>`).join('')}</div>
<h2>Ваш прогресс</h2>
<div class="st"><div class="c"><b>${tot}</b>попыток</div><div class="c"><b>${tot?avg+'%':'—'}</b>средний результат</div></div>
${tot?`<h2>Последние попытки</h2><div class="c tw"><table><tr><th>Дата</th><th>Тест</th><th>Баллы</th><th>%</th></tr>${H.slice(-10).reverse().map(h=>`<tr><td>${h.d}</td><td>${T.find(t=>t.id===h.id).t.split(/ и /)[0].replace(/,.*/,'')}</td><td>${h.sc}/40</td><td>${h.p}%</td></tr>`).join('')}</table></div><p><button class="o" id="rs">Сбросить историю</button></p>`:'<p class="s">Пройдите первый тест, и здесь появится история результатов.</p>'}`;
A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>start(+b.dataset.s));
$('cu').onclick=reg;
const r=$('rs');if(r)r.onclick=()=>{if(confirm('Удалить всю историю результатов?')){H=[];save();home()}};
window.scrollTo(0,0)}
let cur,qs,ix,sc,wr;
const L=(t,ty)=>t.split('\n').map(l=>{const p=l.split('|');return{s:p[0],a:p[1],ty}});
let lastOk=true;
const GR=[['#ffd9e8','#d9e8ff'],['#d9f5e6','#fff2c9'],['#e6dcff','#ffe0d6'],['#d6f0ff','#e9ffd9']];
const MG=[['😎','ME AFTER GETTING','THE TENSE RIGHT'],['🎉','PRESENT PERFECT?','MORE LIKE PERFECTLY DONE'],['🧠','BIG BRAIN TIME','GRAMMAR ACTIVATED'],['🦸','I HAVE BEEN WINNING','ALL DAY LONG'],['😺','I WILL DO IT','AND I DID IT'],['🐸','YOU ARE ON FIRE','KEEP GOING']];
const MB=[['😅','ME: I KNEW THIS','ALSO ME: I HAD FORGOTTEN'],['🙃','WHEN THE ANSWER WAS','RIGHT THERE'],['🥲','IT IS FINE','I AM LEARNING'],['🐢','SLOW AND STEADY','WINS THE TEST'],['🤔','PAST SIMPLE OR','PRESENT PERFECT?'],['💪','MISTAKES ARE HOW','WE LEARN']];
function meme(ok){
const m=sh(ok?MG:MB)[0],g=sh(GR)[0],id='g'+(Math.random()*1e6|0);
const tx=(t,y)=>`<text x="200" y="${y}" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-weight="800" font-size="${Math.min(30,Math.floor(380/(t.length*.66)))}" fill="#fff" stroke="#3d3b4f" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
return `<svg viewBox="0 0 400 300" role="img" aria-label="${m[1]} ${m[2]}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs><rect width="400" height="300" fill="url(#${id})"/><text x="200" y="195" text-anchor="middle" font-size="130">${m[0]}</text>${tx(m[1],48)}${tx(m[2],282)}</svg>`}
function mm(){
A.innerHTML=`<div class="row"><b>${cur.t}</b><span>${ix+1} / ${qs.length}</span></div><div class="bar"><i style="width:${(ix+1)/qs.length*100}%"></i></div><div class="meme">${meme(lastOk)}</div><p class="s" style="text-align:center">${lastOk?'Nice one!':'No worries, keep going!'}</p><p style="text-align:center"><button id="g2">Дальше</button></p>`;
$('g2').focus();$('g2').onclick=()=>{ix++;ask()};window.scrollTo(0,0)}
function start(i){cur=T[i];const e=EX[cur.id];
qs=sh([...sh(parse(cur)).slice(0,30),...sh(L(e.f,'f')).slice(0,6),...sh(L(e.x,'x')).slice(0,4)]);ix=0;sc=0;wr=[];ask()}
function ask(){
const q=qs[ix],ty=q.ty;
const tag=ty==='f'?'Впишите недостающее слово или форму глагола':ty==='x'?'Найдите ошибку и перепишите предложение правильно':'Выберите правильный вариант';
A.innerHTML=`<div class="row"><b>${cur.t}</b><span>${ix+1} / ${qs.length}</span></div><div class="bar"><i style="width:${ix/qs.length*100}%"></i></div>
<p class="s" style="margin:0 0 6px">${tag}</p><p class="q">${fq(q.s)}</p>`+(ty?`<input id="in" class="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ваш ответ"><p style="margin:12px 0 0"><button id="ck">Проверить</button></p><div id="fb"></div>`:`<div id="os">${sh(q.o).map(o=>`<button class="opt" data-o="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>`)+`<div id="nx"></div>`;
if(ty){const i=$('in');i.focus();$('ck').onclick=()=>chk(q);i.onkeydown=e=>{if(e.key==='Enter')chk(q)}}
else A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q));
window.scrollTo(0,0)}
function nxt(){
const last=ix===qs.length-1;
$('nx').innerHTML=`<p><button id="go">${last?'Показать результат':'Дальше'}</button></p>`;
$('go').focus();$('go').onclick=()=>{if(last)end();else if((ix+1)%3===0)mm();else{ix++;ask()}}}
function pick(b,q){
const ok=lastOk=b.dataset.o===q.a;
A.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.o===q.a)x.classList.add('ok')});
if(ok)sc++;else{b.classList.add('no');wr.push({s:q.s,a:q.a,p:b.dataset.o})}
nxt()}
function chk(q){
const u=$('in').value.trim();if(!u)return;
const ok=lastOk=same(u,q.a),a=q.a.split('/')[0];
$('in').disabled=true;$('ck').remove();
if(ok)sc++;else wr.push({s:q.s,a,p:u});
$('fb').innerHTML=`<div class="m" style="background:${ok?'var(--okb)':'var(--nob)'}">${ok?'Верно!':'Неверно. Правильный ответ: <b>'+esc(a)+'</b>'}</div>`;
nxt()}
function end(){
const p=pct(sc,qs.length);
H.push({id:cur.id,sc,p,d:new Date().toLocaleDateString('ru-RU')});save();
A.innerHTML=`<h1>${cur.t}</h1><div class="meme">${meme(p>=60)}</div><p class="big">${sc}/${qs.length}</p><p class="s">${esc(U)}, ${p}% правильных ответов · ${p>=85?'отличный результат':p>=60?'хорошо, но есть над чем поработать':'стоит повторить тему и попробовать снова'}</p>
<p class="row" style="justify-content:flex-start"><button id="ag">Пройти ещё раз</button><button class="o" id="hm">К списку тестов</button></p>
${wr.length?`<h2>Разбор ошибок (${wr.length})</h2>${wr.map(w=>`<div class="m">${fq(w.s)}<br>Ваш ответ: <s>${esc(w.p)}</s> · Верно: <b>${esc(w.a)}</b></div>`).join('')}`:'<h2>Без ошибок!</h2>'}`;
$('ag').onclick=()=>start(T.indexOf(cur));$('hm').onclick=home;window.scrollTo(0,0)}
U?(load(),home()):reg();
</script></body></html>
